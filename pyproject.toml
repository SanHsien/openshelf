[project]
name = "openshelf"
version = "1.0.4"
description = "枚舉並批次匯出 Google Play 圖書：無 DRM 書下載 EPUB/PDF，DRM 書下載官方 .acsm 供 Adobe Digital Editions 閱讀。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "SanHsien", email = "sanhsien@pm.me" }]
dependencies = [
    "playwright>=1.62.0",
    "httpx>=0.28.1",
    "click>=8.5.0",  # freshness-hold: 8.4.2 是我們實際承諾的相容下限。openshelf.cli 只用 click 的公開穩定 API（group/option/Choice/pass_context/ClickException），沒有任何一處需要 8.5 才有的行為；把下限跟著 PyPI 往上抬，只會讓受控或離線環境（只提供 8.4.2）安裝失敗，換到的僅是報告不再亮紅燈。
    "rich>=15.0.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.11.2"]
build = ["pyinstaller>=6.22.2"]
maintenance = ["packaging>=26.3"]

[project.scripts]
openshelf = "openshelf.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openshelf*"]
